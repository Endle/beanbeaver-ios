[package]
name = "beanbeaver-ios-ffi-build"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "uniffi-bindgen"

# Both bins live in the `shared/` submodule (beanbeaver-mobile-util) — Android
# builds the same two files from the same commit. They are compiled *here*
# rather than depended on as a crate so each app builds them against its own
# pinned bb-receipt-ffi tag: batch_e2e.rs uses OcrSession/Phase/ScanTimings/
# ReceiptWarningKind, so a breaking FFI bump changes it. `git submodule update
# --init` if `shared/` is empty.

[[bin]]
name = "uniffi-bindgen"
path = "shared/src/bin/uniffi-bindgen.rs"

[[bin]]
name = "batch_e2e"
path = "shared/src/bin/batch_e2e.rs"

# The profile the shipped static library is built with. Cargo honours
# `[profile.*]` only in the workspace root, and this package is that root for
# everything below it -- so these two lines reach bb-mobile-ffi, bb-receipt-ffi
# and every crate they pull in. Without them cargo's defaults (no LTO, 16
# codegen units) applied, and nothing here had ever set them.
#
# Measured on the linked Release binary for iphoneos (BeanBeaver.app/BeanBeaver):
#   38,692,152 -> 36,857,200 bytes  (-1.75 MiB, -4.7%)
#
# Only the Rust in the library responds to this. The rest of the binary is ONNX
# Runtime, ONNX, Eigen and protobuf, which arrive as prebuilt C++ and are
# untouched by any cargo profile setting.
#
# `panic = "abort"` is deliberately NOT set. It is worth ~0.36 MB (measured on
# the Android twin), but UniFFI's scaffolding wraps every call in `catch_unwind`
# to turn a Rust panic into a Swift-visible error; aborting would turn a panic
# on one odd photo into a process kill. Not a trade worth 0.36 MB in an app that
# parses arbitrary user photos.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
# v0.3.0 adds per-item semantic tags: ReceiptItem now carries `tags: [String]`
# (the beanbeaver-internal multi-tag classification the app's category display
# reads from). v0.2.0 added portable-receipt-identity (beanbeaver_id/
# document_relpath + real `document:` metadata). v0.3.2 is parser/field-extraction
# robustness + item-classifier/merchant-family rule fixes (no FFI/API change).
# v0.3.3 DOES change the FFI surface: parse-only entry point, rule overlays,
# per-field confidences, and reformat (plus receipt-core/ocr-paddle refactors).
# v0.4.0 adds the size-prior banner merchant extractor (behavior) and a new
# `OcrDetection` record + `ReceiptResult.detections` (raw OCR boxes for the
# headless batch dump / snapshot diffing).
# v0.4.1 adds merchant-recognition fixes (behavior only, no FFI change): a
# PHARMASAVE family, and whitespace-tolerant corroborators (Costco "WHOL ESALE").
# v0.5.0 makes the output currency + tax account configurable: scan /
# scan_with_options / parse_detections / reformat_receipt gain `currency` +
# `tax_account` params (breaking FFI change — drops the hard-coded CAD / HST).
# After bumping, rerun ./build-xcframework.sh to regenerate the Swift glue + xcframework.
# v0.6.0 reshapes ScanTimings into a `Phase` enum + `[PhaseSpan]` span list (the
# shared cross-platform phase taxonomy) and adds a `decode` span. Breaking FFI
# change — rerun ./build-xcframework.sh after bumping to regenerate the Swift glue.
# v0.6.4 is parser/rules only, no FFI change: stacked store logos (Costco's
# "COSTCO" over "WHOLESALE", Shoppers' "SHOPPERS" over "DRUG MART") stay separate
# lines and are rejoined for merchant matching, plus merchant-scoped abbreviation
# expansion and vowel-dropped brand abbreviations.
# v0.7.1 is rules-data only, no FFI change: PRONAMEL (Sensodyne toothpaste) and
# DOORDASH gift cards now classify instead of falling through to Expenses:FIXME.
# The rules are compiled into the staticlib, so the xcframework still has to be
# rebuilt for the app to see them.
# v0.7.2 lands the detection deskew (#38) and two classifier rule fixes (#39).
# The deskew had never actually fired before — its consensus gate was
# unreachable on any real receipt — so this is the first build where a tilted
# photo gets its rows re-seated. Note #38 removed three public DESKEW_* RANSAC
# constants; nothing here referenced them.
# v0.7.3 is parser/rules only, no FFI change: parse_receipt now warns when the
# item + tax postings *overshoot* the receipt total (the formatter only ever
# closed an undershoot, so an unbalanced transaction shipped with an empty
# warnings list). Expect the ⚠️ badge to appear on the 6 corpus receipts that are
# genuinely wrong. Also classifies WATERMLN/WTRMLN as fruit, not a drink.
# v0.7.4 is rules-data only, no FFI change: "YOG" (how No Frills abbreviates
# yogurt) classifies as dairy instead of falling through to Expenses:FIXME. The
# rules are compiled into the staticlib, so the xcframework still has to be
# rebuilt for the app to see them.
# v0.7.5 is parser/rules only, no FFI change, and recovers dropped items: the
# address veto in the spatial pairer alternated over bare tokens (RD, ST, DR,
# ON), so any item containing one was silently discarded — "ON THE GO BOTTLE",
# "TNS RD HT BF BRR". It now applies only to unpriced lines. Also fixes a date
# read 24 years off when OCR mangles "DateTime:" into "Datelime:", and files
# CHICKN as meat rather than letting ORANGE win.
# v0.7.6 is parser/rules only, no FFI change, and recovers dropped items on
# weighed produce: OCR renders "lb @" as "1b'@" or "1b-@", which the weight-rate
# pattern didn't match, so the row stopped being a quantity expression, became an
# item itself, and took the price while dropping the name printed above it
# ("Napa Round", "Winter Melon" → Expenses:FIXME). Also reads a comma-for-decimal
# grand total ("Total after Tax 110,05" used to yield a 0.00 card posting), and
# files winter melon as a vegetable rather than fruit.
# v0.7.7 is parser-only, no FFI change, and fixes receipts photographed at a
# tilt. On a 3.8-deg tilt the price column drifts a full row across the receipt's
# width, so every price is claimed by the row below its own — one No Frills scan
# lost an item and gave the remaining three their neighbours' prices while
# reporting itself clean. The deskew pass needed 5 same-row item/price pairs to
# measure the tilt and a short receipt cannot supply them; it now falls back to
# a pairing-free row-tightness search, still gated on agreement from the pairs it
# does have. Also reads a total whose "$" OCR'd as a "5" ("$173.15" → "5173.15").
# v0.7.8 is parser-only, no FFI change. Two summary-block fixes plus a new
# warning. (a) A tax that is *impossible* — equal to the total or the subtotal,
# which is how label/amount drift in the summary block shows up — is re-derived
# from SUBTOTAL + TAX = TOTAL. (b) The parser now says so when the items
# disagree with the printed subtotal: an undershoot used to be closed silently
# by an Expenses:FIXME plug, so a receipt could be entirely mis-paired and still
# report clean. Expect the warning badge on more receipts — 14 -> 21 of 122 in
# the corpus, every new one genuinely wrong, two of which parsed zero items.
# v0.8.3 is parser-only, no FFI change, and re-aligns prices on Costco scans. Two
# rows that cannot hold money were claiming it, and a wrong claim is never local
# here — prices are consumed one-to-one in reading order, so the real amount falls
# through and every following row inherits its neighbour's. (a) The RIGHT
# partition is geometric, so it also caught Costco's per-line `H`/`HH`/`E` tax
# column; a digit-less token there now routes to MIDDLE, still attached to its row
# but no longer mistakable for its price. (b) `Member <digits>` joins the code
# stubs typed "never carries an amount". On one 2026-03-05 Costco scan this
# corrects five item prices that were each off by a row.
# v0.9.2 ADDS one FFI enum variant and is not breaking:
# `ReceiptWarningKind::implausibleSummary` (core #64) — a summary block that
# cannot be right (no total found while items parsed, or subtotal == tax) is
# reported instead of silently reading 0.00. Kinds are open by contract, so
# `WarningSeverity.swift`'s `@unknown default` and `ReceiptBatch.swift`'s two
# name/kind switches already absorb it; ranking it explicitly is a follow-up,
# not a blocker. The parse content is core #67, the same family of fix as v0.8.3
# above: Loblaw department headers (`21-GROCERY`, `22-DAIRY`, …) print at the
# left margin, so the indent yield read them as banners and let them keep an
# amount belonging to a neighbouring row. Typed "never carries an amount" they
# stop, and the rows below stop inheriting the shift. Measured on the 123-receipt
# private corpus: 885/1008 -> 893/1008 critical items, three receipts better,
# none worse. That number is a CPU-EP measurement (device_sim), and this app is
# on the CPU EP too, so it tracks here as closely as it does on Android. (This
# comment used to say "this app runs CoreML, which device_sim cannot reproduce"
# -- wrong since 3c580a6, 2026-07-01, which dropped CoreML because CPU won on
# both speed and accuracy. build-xcframework.sh does not enable the feature.)
#
# v0.9.3 changes no code this app calls. It is dependency hygiene in the core:
# ocr-paddle depended on `imageproc` with default features, whose
# `image/default` re-enabled every codec on the `image` crate and defeated the
# `default-features = false, features = ["jpeg", "png"]` all four core crates
# declare. Cargo unifies features graph-wide, so one permissive dependant
# re-armed avif/exr/gif/tiff/webp/... for the whole graph -- including rav1e, an
# AV1 video *encoder*. It is not dead weight the linker drops: the binary this
# app shipped before this bump carried 1367 rav1e symbols. WebP decoding is kept
# on purpose, because the FFI seam sniffs the format of bytes it did not
# produce. The only behavioural change in the v0.9.2..v0.9.3 range is unrelated
# -- core #70 files SALT as a seasoning rather than a staple.
bb-receipt-ffi = { git = "https://github.com/Endle/beanbeaver-core", tag = "v0.9.3" }
# The library the app actually links. It carries bb-receipt-ffi's UniFFI
# scaffolding inside it, so ONE libbb_mobile_ffi.a exposes both namespaces and
# build-xcframework.sh runs one codegen step. It also brings `spend-core`, the
# spend/budget arithmetic shared with beanbeaver-android.
#
# THE TWO PINS MUST AGREE ON THE CORE TAG. bb-mobile-ffi pins bb-receipt-ffi
# itself; if this file pins a different one, cargo resolves two copies of the
# core and the xcframework links the wrong one. The direct bb-receipt-ffi dep
# above is only for shared/src/bin/batch_e2e.rs, which uses the core's Rust API.
# Cargo.lock is committed — a duplicate bb-receipt-ffi entry there is the tell.
bb-mobile-ffi = { git = "https://github.com/Endle/beanbeaver-mobile-util", tag = "v0.1.5" }
# `cli` provides uniffi_bindgen_main() for the local src/bin/uniffi-bindgen.rs,
# which build-xcframework.sh runs to generate the Swift glue. Keep the version in
# step with the uniffi that bb-receipt-ffi pulls in (0.28).
uniffi = { version = "0.28", features = ["cli"] }
